<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>柱状図ビューア</title>
<meta name="description" content="国交省XML・柱状BASE（.bor）・岩盤BASE（.gan）の柱状図を表示・編集するアプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="柱状図">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d5b85">
<style>[hidden]{display:none!important}body{margin:0;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}</style>
</head>
<body>
<style>
/* Layout: 左に図面シート（紙の白地・独立スクロール）、右に編集パネル。狭い画面では縦に積む */
:root{
  --bg:#e9eef0; --panel:#f8fafb; --ink:#1c2830; --muted:#5a6872; --line:#cad3d8;
  --accent:#1d5b85; --accent-ink:#ffffff; --water:#1a78c2; --warn:#a1560b; --chip:#dde6eb;
  --sheet:#ffffff; --sheet-ink:#1f1f1f; --sheet-grid:#e3e6e8; --sheet-muted:#6b7378;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171b; --panel:#182127; --ink:#e2e9ed; --muted:#93a2ab; --line:#2b3841;
  --accent:#6aaedb; --accent-ink:#0d1a22; --water:#5fb2ef; --warn:#e8a25a; --chip:#22303a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171b; --panel:#182127; --ink:#e2e9ed; --muted:#93a2ab; --line:#2b3841;
  --accent:#6aaedb; --accent-ink:#0d1a22; --water:#5fb2ef; --warn:#e8a25a; --chip:#22303a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px}
.brand{font-weight:700;font-size:16px;letter-spacing:.04em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.08em}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.small{min-height:30px;padding:3px 9px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select.sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;min-height:36px;max-width:240px}
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 16px 24px}
@media (min-width:960px){
  .app{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:minmax(0,1fr);height:calc(100% - 58px)}
  .fig-col{min-height:0;display:flex;flex-direction:column}
  .fig-scroll{flex:1;min-height:0;max-height:none!important}
  .edit{overflow:auto;min-height:0}
}
.info{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:8px}
.info h1{font-size:20px;margin:0;letter-spacing:.02em;text-wrap:balance}
.kv{display:flex;gap:6px;align-items:baseline;color:var(--muted);font-size:12px}
.kv b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;background:var(--chip);border-radius:4px;padding:1px 7px;font-size:11px;letter-spacing:.05em;color:var(--ink)}
.status{font-size:12px;color:var(--muted);margin:0 0 8px}
.status .w{color:var(--warn)}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 0 10px;border-top:1px solid var(--line)}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;user-select:none}
.tg input{width:18px;height:18px;accent-color:var(--accent)}
.num-in{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.num-in input[type=number]{width:74px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:4px 6px;font-family:var(--f-num)}
.num-in input[type=range]{width:120px;accent-color:var(--accent)}
.num-in output{font-family:var(--f-num);font-size:12px;color:var(--muted);min-width:56px}
.fig-scroll{background:var(--sheet);border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:78dvh;position:relative;-webkit-overflow-scrolling:touch}
.fig-scroll svg{display:block}
#figHead{position:sticky;top:0;z-index:2}
.drop{outline:3px dashed var(--accent);outline-offset:-6px}
.edit{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tw{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;font-size:13px}
table.ed th{font-weight:400;color:var(--muted);font-size:11px;text-align:left;padding:4px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ed td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ed input{width:100%;min-width:0;border:1px solid transparent;border-radius:4px;background:transparent;padding:4px 5px}
table.ed input:hover{border-color:var(--line)}
table.ed input:focus{border-color:var(--accent);background:var(--bg)}
table.ed input.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
table.ed td.ro{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
table.ed.spt th.c,table.ed.spt td.c{text-align:center}
table.ed.spt th.wrap{white-space:normal;line-height:1.35}
table.ed.spt input{width:100%;min-width:0}
table.ed.spt td.iv{padding:2px 1px;min-width:38px}
table.ed.spt td.dp{min-width:60px;width:60px}
table.ed.spt td.dp input{padding:4px 2px;font-size:13px}
table.ed.spt td.ro{font-size:11px;line-height:1.5;padding:2px 2px}
table.ed.spt .nv{font-size:13px;color:var(--ink);font-weight:500}
table.ed.spt td.iv input{display:block;padding:3px 4px;text-align:center}
table.ed.spt td.iv input.pen{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);border-radius:0 0 4px 4px}
table.ed.spt td.iv input.pen:focus{color:var(--ink)}
table.ed td.top{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.sw{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);line-height:1.25}
.sw svg{flex:none;border:1px solid var(--line);background:#fff}
/* 岩盤タブ */
.rkcards{display:flex;flex-direction:column;gap:8px}
.rkc{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.rkc1{display:flex;align-items:flex-end;gap:6px}
.rkc1 .rtop{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);padding-bottom:7px;white-space:nowrap}
.rkc1 .rkf:nth-of-type(1){flex:0 0 76px}.rkc1 .rkf:nth-of-type(2){flex:1}
.rkc1 .del{margin-left:auto}
.rkc2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.rkf{display:flex;flex-direction:column;gap:2px;min-width:0}
.rkf span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkc input{width:100%;min-width:0;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:5px 4px;text-align:center}
.rkc input.n{text-align:right;font-family:ui-monospace,monospace}
.rkc input.subn{text-align:left;font-size:12px}
.rkc textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:5px 6px;resize:vertical}
.seg{display:flex;gap:4px;margin:0 0 10px;flex-wrap:wrap}
.segb{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.segb[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
table.ed.rk td{padding:2px 2px}
table.ed.rk td.dp{width:62px;min-width:58px}
table.ed.rk td.x{width:26px}
table.ed.rk input{text-align:center;padding:4px 2px;font-size:13px}
table.ed.rk input.n{text-align:right}
table.ed.rk input:not(.n){min-width:4.5em}
table.ed.rk.iv tr.sub td{border-bottom:2px solid var(--line);padding-bottom:6px}
table.ed.rk.iv tr:not(.sub) td{border-bottom:0}
table.ed.rk textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit;font-size:12px;padding:4px 6px;resize:vertical}
table.ed.rk input.subn{text-align:left;font-size:11px;color:var(--muted);margin-top:2px}
table.ed.wl select{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:4px 4px;font:inherit;font-size:13px;color:var(--ink)}
table.ed.wl td:first-child{width:76px}
.del{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:4px}
.del:hover{color:var(--warn);background:var(--chip)}
.row-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;font-size:13px}
.form label{color:var(--muted);font-size:12px}
.form input,.form textarea{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:6px 8px;width:100%;color:var(--ink);font:inherit}
.form textarea{resize:vertical;min-height:96px;line-height:1.55}
.form select{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:6px 8px;width:100%;color:var(--ink);font:inherit;min-height:36px}
.dep{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dep input{width:96px;flex:none;font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.dep input:disabled{opacity:.6}
.dep .el{font-family:var(--f-num);font-size:12px;margin-left:auto;white-space:nowrap}
.ld-msg{margin:-2px 0 0;font-size:12px;color:var(--warn);min-height:0}
.ld-msg:empty{display:none}
.ld-pred{margin:0;font-size:12px;color:var(--muted)}
.ld-pred:empty{display:none}
.ld-pred b{color:var(--ink);font-weight:700}
.ld-pred .btn{margin-left:6px}
.form .full{grid-column:1 / -1}
.modal.side{background:rgba(10,18,24,.18)}
@media (min-width:960px){.modal.side{justify-content:flex-end;padding-right:24px}}
.ly-head{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.ly-head h2{margin:0}
.ly-depth{font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ly-sw{margin:-4px 0 12px}
.attr{font-size:11px;color:var(--muted);padding:0 5px 4px}
.more{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:11px;border-radius:4px;padding:3px 7px;white-space:nowrap}
.more:hover{border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
h3.sub{font-size:13px;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
h3.sub.first{margin-top:4px;padding-top:0;border-top:0}
table.ed.dr th small{font-size:10px}
table.ed.dr input.bad{color:#c0392b}
.note.warn{color:#b35c00}
.prev{margin:0 0 12px;text-align:center}
.kind{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;margin:0 0 12px}
.kind > span{font-size:12px;color:var(--muted)}
.kind label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.kind input{width:17px;height:17px;accent-color:var(--accent)}
.prev img{width:100%;max-width:300px;border:1px solid var(--line);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.badge{white-space:nowrap;font-size:10px;background:var(--water);color:#fff;border-radius:3px;padding:0 5px;margin-left:4px}
.empty{padding:40px 16px;text-align:center;color:var(--sheet-muted);font-size:13px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,18,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 60px) 16px 16px;overflow:auto}
.dlg{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:100%;max-width:440px;padding:18px 18px 16px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.dlg h2{font-size:16px;margin:0 0 12px}
.fmt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:420px){.fmt{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fmt label{border:1px solid var(--line);border-radius:6px;padding:8px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.fmt label b{font-family:var(--f-num);font-weight:500;font-size:14px}
.fmt label span{font-size:11px;color:var(--muted)}
.fmt input{position:absolute;opacity:0;pointer-events:none}
.fmt label:has(input:checked){border-color:var(--accent);background:var(--chip);box-shadow:inset 0 0 0 1px var(--accent)}
.fmt label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.dlg .fn{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.dlg .fn input{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:7px 8px;font-family:var(--f-num);font-size:14px;color:var(--ink)}
.dlg ul{margin:0 0 12px;padding-left:18px;font-size:12px;color:var(--muted)}
.dlg ul li.w{color:var(--warn)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.dlg .msg{font-size:12px;margin:10px 0 0;min-height:1em}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 16px;font-size:13px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--warn);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="brand">柱状図ビューア <small>XML / BOR / GAN</small></div>
  <select id="logSel" class="sel" aria-label="表示する孔"></select>
  <label class="btn primary" for="fileIn">ファイルを開く</label>
  <input id="fileIn" class="hidden-input" type="file">
  <button id="btnSample" class="btn" type="button">サンプル</button>
  <button id="btnSave" class="btn" type="button">保存</button>
  <button id="btnClose" class="btn" type="button">閉じる</button>
</header>

<main class="app">
  <section class="fig-col" aria-label="柱状図">
    <div class="info" id="info"></div>
    <p class="status" id="status"></p>
    <div class="opts">
      <label class="tg"><input type="checkbox" id="oElev" checked> 標高</label>
      <label class="tg"><input type="checkbox" id="oLog" checked> 柱状図</label>
      <label class="tg"><input type="checkbox" id="oN" checked> N値</label>
      <label class="tg"><input type="checkbox" id="oColor"> 色付け</label>
      <span class="num-in"><label for="oScale">縦スケール</label><input type="range" id="oScale" min="4" max="80" step="1" value="24"><output id="oScaleV">24 px/m</output></span>
      <button class="btn small" id="btnFit" type="button">全体表示</button>
    </div>
    <div class="fig-scroll" id="figScroll">
      <svg id="figHead" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="figBody" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </section>

  <section class="edit" aria-label="データ編集">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="layers" aria-selected="true" id="tab-layers">層区分</button>
      <button class="tab" role="tab" data-tab="spt" aria-selected="false" id="tab-spt">N値</button>
      <button class="tab" role="tab" data-tab="water" aria-selected="false" id="tab-water">水位・掘進</button>
      <button class="tab" role="tab" data-tab="rock" aria-selected="false" id="tab-rock">岩盤</button>
      <button class="tab" role="tab" data-tab="basic" aria-selected="false" id="tab-basic">基本情報</button>
    </div>
    <div id="editBody"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" hidden></div>
<div class="modal side" id="lyModal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="lyTitle">
    <div class="ly-head"><h2 id="lyTitle">層の詳細</h2><span class="ly-depth" id="lyDepth"></span></div>
    <div class="ly-sw" id="ld-sw"></div>
    <div class="form">
      <label for="ld-top">上端深度</label><div class="dep"><span>GL-</span><input id="ld-top" data-d="top" inputmode="decimal" autocomplete="off"><span>m</span><span class="el" id="ld-top-el"></span></div>
      <label for="ld-bottom">下端深度</label><div class="dep"><span>GL-</span><input id="ld-bottom" data-d="bottom" inputmode="decimal" autocomplete="off"><span>m</span><span class="el" id="ld-bottom-el"></span></div>
      <p class="ld-msg full" id="ldMsg" role="status"></p>
      <label for="ld-name">土質名</label><input id="ld-name" data-f="name" autocomplete="off">
      <label for="ld-code">記号</label><input id="ld-code" data-f="code" autocomplete="off">
      <label for="ld-color">色調</label><input id="ld-color" data-f="color" list="dl-color" autocomplete="off">
      <label for="ld-density">相対密度</label><select id="ld-density" data-f="density"></select>
      <label for="ld-consistency">相対稠度</label><select id="ld-consistency" data-f="consistency"></select>
      <p class="ld-pred full" id="ldPred" role="status"></p>
      <label for="ld-note" class="full">記事</label><textarea id="ld-note" data-f="note" class="full" rows="5"></textarea>
    </div>
    <div class="acts" style="margin-top:14px">
      <button class="btn" type="button" id="ldPrev">前の層</button>
      <button class="btn" type="button" id="ldNext">次の層</button>
      <span style="flex:1"></span>
      <button class="btn primary" type="button" id="ldClose">閉じる</button>
    </div>
  </div>
</div>
<datalist id="dl-hard"><option value="A"><option value="B"><option value="C"><option value="D"><option value="E"></datalist>
<datalist id="dl-shape"><option value="I"><option value="II"><option value="III"><option value="IV"><option value="V"><option value="VI"><option value="VII"><option value="VIII"><option value="III～IV"><option value="IV～V"></datalist>
<datalist id="dl-crack"><option value="a"><option value="b"><option value="c"><option value="d"></datalist>
<datalist id="dl-weather"><option value="w1"><option value="w2"><option value="w3"><option value="w4"></datalist>
<datalist id="dl-alter"><option value="1"><option value="2"><option value="3"><option value="4"></datalist>
<datalist id="dl-cls"><option value="A"><option value="B"><option value="ＣH"><option value="ＣM"><option value="ＣL"><option value="Ｄ"></datalist>
<datalist id="dl-wtype"><option value="W1"><option value="W2"><option value="W3"><option value="W4"></datalist>
<datalist id="dl-bit"><option value="D/DB"><option value="S/MC"><option value="S/DB"></datalist>
<datalist id="dl-casing"><option value="ケーシング"><option value="セメンティング"><option value="泥水"></datalist>

<script>
"use strict";
/* ============================================================
   データモデル
   log = { id, source, format, name, elev, total,
           layers:[{bottom,name,code,color,note}],
           spt:[{depth,blows,pen}]   pen は cm
           water:[{depth,date}]      ファイル順＝測定順
           classes:[{top,bottom,label}],
           warnings:[], sample:bool }
   ============================================================ */
const KEY = 'chuzyozu.v1';
const S = { logs: [], cur: 0, tab: 'layers', opt: { elev: true, log: true, n: true, color: false, shift: 0, ppm: 24 } };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mdNorm(v){
  const t = z2h(v).replace(/[／・，、]/g, '/').trim(); if (!t) return '';
  let m = t.match(/^(\d{1,2})\D+(\d{1,2})$/);
  if (!m && /^\d{3,4}$/.test(t)) m = [t, t.slice(0, t.length - 2), t.slice(-2)];
  if (m) { const mo = +m[1], da = +m[2]; if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) return `${mo}/${da}`; }
  return t;
}
const z2h = s => String(s ?? '').replace(/[０-９．－＋]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
function num(s){ if (s === null || s === undefined) return null; const t = z2h(s).trim(); if (t === '' || t === '@') return null; const v = parseFloat(t); return Number.isFinite(v) ? v : null; }
const f2 = v => (v === null || v === undefined || !Number.isFinite(v)) ? '' : v.toFixed(2);
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------------- N値の算出（仕様 8.2） ---------------- */
function calcN(sp){
  const b = sp.blows, p = sp.pen;
  if (b === null || p === null || b === undefined || p === undefined) return { N: null, label: '' };
  if (p >= 30 || b === 0) return { N: b, label: '' };
  if (p <= 0) return { N: b, label: `${b}/0` };
  return { N: b * 30 / p, label: `${b}/${Math.round(p)}` };
}

/* ---------------- 文字コード判定と読込 ---------------- */
function decode(buf, hint){
  const head = new TextDecoder('latin1').decode(buf.slice(0, 300));
  const m = head.match(/encoding\s*=\s*["']([\w\-]+)["']/i);
  if (m && !/utf-?8/i.test(m[1])) { try { return new TextDecoder(m[1].toLowerCase().replace('_','-') === 'shift-jis' ? 'shift_jis' : m[1]).decode(buf); } catch(e){} }
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('shift_jis').decode(buf); }
}
function detect(text, fname){
  const first = text.replace(/^﻿/, '').split(/\r?\n/)[0].trim();
  if (/^TPJ/.test(first)) return 'bor';
  if (/^GTJ/.test(first)) return 'gan';
  if (/^</.test(first)) return 'xml';
  const ext = (fname.split('.').pop() || '').toLowerCase();
  if (['bor','gan','xml'].includes(ext)) return ext;
  return null;
}
function parseAny(text, fname){
  const fmt = detect(text, fname);
  if (fmt === 'xml') return parseXML(text, fname);
  if (fmt === 'bor') return parseBOR(text, fname);
  if (fmt === 'gan') return parseGAN(text, fname);
  throw new Error(`${fname}: 形式を判定できません（国交省XML・.bor・.gan に対応）`);
}
function newLog(fmt, fname){
  return { id: uid(), source: fname, format: fmt, name: '', elev: null, total: null, layers: [], spt: [], water: [], classes: [], drill: [], samples: [], units: [], hdr: {}, rock: {}, warnings: [] };
}
// 孔内水位の作業前・作業後。ファイルに区別がないときは、同じ日の2件目以降を作業後とみなす
function assignTiming(L){
  let prevDate = null;
  for (const w of L.water) {
    if (!w.timing) {
      const hint = w.x ? Object.values(w.x).join(' ') : '';
      w.timing = /作業後|終了後|夕/.test(hint) ? '作業後' : /作業前|開始前|朝/.test(hint) ? '作業前'
        : (w.date && w.date === prevDate) ? '作業後' : '作業前';
    }
    prevDate = w.date;
  }
}
function finish(L){
  assignTiming(L);
  const lb = L.layers.length ? L.layers[L.layers.length - 1].bottom : 0;
  const sd = L.spt.length ? Math.max(...L.spt.map(s => s.depth + 0.3)) : 0;
  if (L.total === null) L.total = Math.max(lb, sd) || null;
  for (let i = 1; i < L.layers.length; i++) if (L.layers[i].bottom < L.layers[i-1].bottom) { L.warnings.push(`層区分の深度が逆転しています（${i+1}層目）`); break; }
  if (!L.layers.length) L.warnings.push('層区分が見つかりませんでした');
  if (!L.name) L.name = L.source.replace(/\.[^.]+$/, '');
  return L;
}

/* ---------------- 国交省 ボーリング交換用データ（XML） ---------------- */
function xmlRecords(doc, tag){
  const out = [];
  for (const el of Array.from(doc.getElementsByTagName(tag))) {
    if (!el.children.length) continue;
    let cur = {};
    for (const lf of Array.from(el.getElementsByTagName('*'))) {
      if (lf.children.length) continue;
      const k = lf.tagName, v = lf.textContent.trim();
      if (k in cur) { out.push(cur); cur = {}; }
      cur[k] = v;
    }
    if (Object.keys(cur).length) out.push(cur);
  }
  return out;
}
const pick = (r, pred) => { for (const k of Object.keys(r)) if (pred(k)) return r[k]; return undefined; };
function fmtDate(s){
  const t = z2h(s || '');
  let m = t.match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
  if (m) return `${+m[2]}/${+m[3]}`;
  m = t.match(/(\d{1,2})\D(\d{1,2})/);
  return m ? `${+m[1]}/${+m[2]}` : t;
}
function parseXML(text, fname){
  const L = newLog('xml', fname);
  L.raw = text;
  const clean = text.replace(/^﻿/, '').replace(/<\?xml[^>]*\?>/, '').replace(/<!DOCTYPE[^>]*>/i, '');
  const doc = new DOMParser().parseFromString(clean, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error(`${fname}: XMLとして読めませんでした`);
  const first = tag => { const e = doc.getElementsByTagName(tag)[0]; return e ? e.textContent.trim() : ''; };
  L.name = first('ボーリング名');
  const dtdVer = parseFloat((doc.documentElement.getAttribute('DTD_version') || '4').replace(/[^\d.]/g, '')) || 4;
  L.elev = num(first('孔口標高'));
  L.total = num(first('総削孔長'));
  try { L.hdr = xmlHdr(doc); } catch (e) { L.hdr = {}; }
  // 層区分
  for (const r of xmlRecords(doc, '工学的地質区分名現場土質名')) {
    const bottom = num(pick(r, k => k.endsWith('_下端深度')));
    const name = pick(r, k => k.includes('_') && k.endsWith('現場土質名')) || '';
    const code = pick(r, k => k.endsWith('記号')) || '';
    if (bottom === null) continue;
    L.layers.push({ bottom, name, code, color: '', note: '', x: r });
  }
  const lyEls = Array.from(doc.getElementsByTagName('工学的地質区分名現場土質名')).filter(el => el.children.length);
  if (lyEls.length === L.layers.length) L.layers.forEach((ly, i) => { ly.xt = xmlTree(lyEls[i]); });
  // 色調・観察記事・相対密度稠度：区間の記録（上端〜下端）を、重なる層すべてに割り当てる
  //   BASE の XML では記事の区間が層と一致しないことがある（同じ層に2つ以上あれば「／」や改行でつなぐ）
  const ivRecs = (tag) => { let prev = 0; return xmlRecords(doc, tag).map(r => {
    const bottom = num(pick(r, k => k.endsWith('下端深度'))); if (bottom === null) return null;
    let top = num(pick(r, k => k.endsWith('上端深度'))); if (top === null) top = prev; prev = bottom;
    return { r, top, bottom };
  }).filter(Boolean); };
  const overIv = (recs, apply) => {
    for (const a of recs) { let t = 0;
      for (const ly of L.layers) { const lo = Math.max(t, a.top), hi = Math.min(ly.bottom, a.bottom);
        if (hi - lo > 1e-3 || (a.bottom - a.top < 1e-3 && near(a.bottom, ly.bottom))) apply(ly, a); t = ly.bottom; } }
  };
  const colR = ivRecs('色調'), noteR = ivRecs('観察記事');
  overIv(colR, (ly, a) => addVal(ly, 'color', pick(a.r, k => k.endsWith('色調名')) ?? '', '／'));
  overIv(noteR, (ly, a) => { const v = xmlNoteIn(pick(a.r, k => k.endsWith('_記事')) ?? ''); if (v) ly.note = ly.note ? ly.note + '\n' + v : v; });
  L.xmlIv = { color: colR.map(a => ({ top: a.top, bottom: a.bottom, v: (pick(a.r, k => k.endsWith('色調名')) || '').trim() })),
    note: noteR.map(a => ({ top: a.top, bottom: a.bottom, v: xmlNoteIn(pick(a.r, k => k.endsWith('_記事')) ?? '') })) };
  overIv(ivRecs('相対密度稠度'), (ly, a) => {
    const DC4 = { d: { 10: '非常に緩い', 20: '緩い', 30: '中ぐらい', 40: '密な', 50: '非常に密な' }, c: { 10: '非常に軟らかい', 20: '軟らかい', 30: '締まった', 40: '硬い', 50: '非常に硬い' } };
    const DC3 = { d: { 1: '非常に緩い', 2: '緩い', 3: '中ぐらい', 4: '密な', 5: '非常に密な' }, c: { 1: '軟らかい', 2: '中位', 3: '硬い', 4: '非常に硬い', 5: '固結した' } };
    const T = dtdVer >= 4 ? DC4 : DC3, cd = (a.r['相対密度_コード'] || '').trim(), cc = (a.r['相対稠度_コード'] || '').trim();
    const dv = a.r['相対密度_状態'] || T.d[+cd] || '', cv = a.r['相対稠度_状態'] || T.c[+cc] || '';
    if (dv) addVal(ly, 'density', dv, '／');
    if (cv) addVal(ly, 'consistency', cv, '／');
    if (!dv && !cv) for (const k of Object.keys(a.r)) {   // 要素名が違う版への備え
      if (/深度|コード/.test(k) || !a.r[k]) continue;
      const kind = k.includes('密度') && !k.includes('稠度') ? 'density' : k.includes('稠度') && !k.includes('密度') ? 'consistency' : guessDC(a.r[k], ly);
      addVal(ly, kind, a.r[k], '／');
    }
  });
  // 標準貫入試験（貫入量は mm）
  for (const r of xmlRecords(doc, '標準貫入試験')) {
    const depth = num(pick(r, k => k.endsWith('開始深度')));
    if (depth === null) continue;
    let blows = num(pick(r, k => k.includes('合計打撃回数')));
    let penmm = num(pick(r, k => k.includes('合計貫入量')));
    if (blows === null || penmm === null) {
      let bs = 0, ps = 0, ok = false;
      for (const k of Object.keys(r)) {
        if (k.includes('合計')) continue;
        if (k.includes('打撃回数')) { const v = num(r[k]); if (v !== null && v >= 0) { bs += v; ok = true; } }
        if (k.includes('貫入量'))   { const v = num(r[k]); if (v !== null && v >= 0) ps += v; }
      }
      if (ok) { blows = bs; penmm = ps; }
    }
    if (blows === null) continue;
    const iv = [];
    const bk = Object.keys(r).filter(k => k.includes('打撃回数') && !k.includes('合計'));
    const pk = Object.keys(r).filter(k => k.includes('貫入量') && !k.includes('合計'));
    bk.forEach((k, j) => { const bb = num(r[k]), pp = num(r[pk[j]]); if (bb !== null && pp !== null && (pp > 0 || (j === 0 && bb > 0))) iv.push([bb, pp / 10]); });
    L.spt.push({ depth, blows, pen: penmm === null ? null : penmm / 10, iv: iv.length ? iv : null, x: r });
  }
  // 孔内水位
  for (const r of xmlRecords(doc, '孔内水位')) {
    let v = r['孔内水位_孔内水位'];
    if (v === undefined) v = pick(r, k => k.endsWith('_孔内水位'));
    if (num(v) === null) v = pick(r, k => k.includes('水位') && !/コード|状況|備考|種別|年月日|時刻/.test(k) && num(r[k]) !== null);
    const depth = num(v);
    if (depth === null) continue;
    const dateRaw = pick(r, k => k.includes('測定年月日')) || '';
    const sc = String(pick(r, k => /(削孔|掘削)状況コード$/.test(k)) ?? '').trim();
    L.water.push({ depth, date: fmtDate(dateRaw), dateRaw, x: r, timing: sc === '1' ? '作業前' : sc === '3' ? '作業後' : undefined });
  }
  // 試料採取・地層名（地質時代）・削孔工程（掘進月日）
  L.samples = xmlRecords(doc, '試料採取').map(r => ({ top: num(r['試料採取_上端深度']), bottom: num(r['試料採取_下端深度']), no: r['試料採取_試料番号'] || '', method: '', mcode: r['試料採取_採取方法コード'] || '' })).filter(x => x.top !== null);
  L.units = xmlRecords(doc, '地質時代').map(r => ({ top: num(r['地質時代_上端深度']), bottom: num(r['地質時代_下端深度']), v: r['地質時代_地質時代名'] || '' })).filter(x => x.top !== null && x.bottom !== null);
  L.drill = [...xmlRecords(doc, '削孔工程'), ...xmlRecords(doc, '掘削工程')].map(r => {
    const dr = pick(r, k => k.endsWith('測定年月日')) || '', cs = pick(r, k => k.includes('ケーシング'));
    return { depth: num(pick(r, k => /(削孔|掘進)深度$/.test(k))), date: fmtDate(dr), dateRaw: dr, casing: num(cs) === null ? '' : String(cs).trim() };
  }).filter(x => x.depth !== null);
  // 岩盤の区間記録（あれば）
  L.rock = {};
  const RT = { hard: ['硬軟区分'], shape: ['ボーリングコアの形状区分', 'コア形状区分'], crack: ['割れ目の状態区分', '割れ目区分'], weather: ['風化の程度区分', '風化区分'],
    alter: ['熱水変質の程度区分', '変質区分'], rec: ['コア採取率'], maxc: ['最大コア長'], rqd: ['RQD'] };   // 先頭が DTD 4.00、後ろは 3.00
  L.dtdVer = dtdVer; L.judge = {};
  const JKEY = { 硬軟区分: 'hard', ボーリングコアの形状区分: 'shape', コア形状区分: 'shape', 割れ目の状態区分: 'crack', 割れ目区分: 'crack', 風化の程度区分: 'weather', 風化区分: 'weather', 熱水変質の程度区分: 'alter', 変質区分: 'alter', 岩級区分: 'cls' };
  const codeMap = (tag, std) => {   // 判定表（○○判定表_コード → _記号）。無ければ要領の標準の表
    const m = new Map(Object.entries(std || {}));
    for (const r of [...xmlRecords(doc, tag + '判定表'), ...xmlRecords(doc, tag + '判定表_判定')]) {
      const c = pick(r, x => x.endsWith('_コード')), s = pick(r, x => x.endsWith('_記号'));
      if (c !== undefined && s) {
        m.set(String(c).trim(), s.trim());
        const k = JKEY[tag]; if (k) { (L.judge[k] = L.judge[k] || {})[s.trim()] = [String(c).trim(), (pick(r, x => x.endsWith('_区分')) || '').trim(), (pick(r, x => x.endsWith('_説明')) || '').trim()]; }
      }
    }
    return m;
  };
  const STD = { 硬軟区分: { '011': 'A', '012': 'B', '013': 'C', '014': 'D', '015': 'E', '021': 'A', '022': 'B', '023': 'C', '024': 'D', '025': 'E' },
    コア形状区分: { '011': 'I', '012': 'II', '013': 'III', '014': 'IV', '015': 'V', '016': 'VI', '017': 'VII', '018': 'VIII', '021': 'I', '022': 'II', '023': 'III', '024': 'IV', '025': 'V', '026': 'VI' },
    割れ目区分: { '011': 'a', '012': 'b', '013': 'c', '014': 'd' } };
  STD.ボーリングコアの形状区分 = STD.コア形状区分; STD.割れ目の状態区分 = STD.割れ目区分;
  L.rockIv = []; L.rockIvBuilt = false;
  for (const [k, tags] of Object.entries(RT)) {
    L.rock[k] = [];
    for (const tag of tags) {
      const cm = codeMap(tag, STD[tag]);
      for (const r of xmlRecords(doc, tag)) {
        const bottom = num(pick(r, x => x.endsWith('下端深度'))); if (bottom === null) continue;
        const v = String(pick(r, x => !x.includes('深度') && !x.includes('コード')) ?? '').trim();
        L.rock[k].push({ top: num(pick(r, x => x.includes('上端深度'))), bottom, v: cm.get(v) || v });
      }
      if (L.rock[k].length) break;
    }
  }
  fixRockTops(L);
  // 岩級区分（あれば）
  const clsMap = codeMap('岩級区分');
  for (const tag of ['岩級区分', '岩級']) {
    let prevB = 0;
    for (const r of xmlRecords(doc, tag)) {
      const bottom = num(pick(r, k => k.includes('下端深度')));
      const top = num(pick(r, k => k.includes('上端深度')));
      const lv = String(pick(r, k => k.includes('岩級') && !k.includes('深度')) ?? '').trim(), label = clsMap.get(lv) || lv;
      if (bottom !== null) { L.classes.push({ top: top ?? prevB, bottom, label, x: r, tag }); prevB = bottom; }   // 岩級のない区間（土砂部など）も空の区間として残す
    }
    if (L.classes.some(c => c.label)) break;
    L.classes = [];
  }
  fixClassTops(L);
  {
    const byDepth = new Map(), row = d => { const k = d.toFixed(2); if (!byDepth.has(k)) byDepth.set(k, { depth: d, speed: '', press: '', rpm: '' }); return byDepth.get(k); };
    const each = (tags, fn) => { for (const t of tags) { const rs = xmlRecords(doc, t); if (rs.length) { rs.forEach(r => { const d = num(pick(r, k => k.endsWith('下端深度'))); if (d !== null) fn(r, d); }); return; } } };
    const v = x => (x === undefined || x === null) ? '' : String(x).trim();
    // 削孔速度・給圧・回転数は別々の区間の記録なので、境界を合わせて1つの表（5020 と同じ形）にする
    const lists = { speed: [], press: [], rpm: [] };
    each(['削孔速度', '掘進速度'], (r, d) => { row(d); lists.speed.push([d, v(pick(r, k => /_(削孔|掘進)速度$/.test(k)))]); });
    each(['給圧条件'], (r, d) => { row(d); lists.press.push([d, v(r['給圧条件_給圧'])]); });
    each(['回転数'], (r, d) => { row(d); lists.rpm.push([d, v(r['回転数_回転数'])]); });

    if (r.after !== null && r.after < 9999 && !L.water.some(w => w.date === r.date && w.timing === '作業後')) L.water.splice(i < 0 ? L.water.length : i + 1, 0, { depth: r.after, date: r.date, timing: '作業後' });
  }
  Object.assign(L.hdr, H);
  L.hdr0 = Object.assign({}, L.hdr); L.elev0 = L.elev;
  L.water0n = L.water.length;
  fixRockTops(L);
  fixClassTops(L);
  refreshRock(L);
  return finish(L);
}

const MOD = [
  ['粘性土','line'],['粘土','line'],['シルト','dash'],['細砂','dots'],['微細砂','dots'],['中砂','dots'],['粗砂','bigdots'],['砂','dots'],

].sort((a,b) => b[0].length - a[0].length);
const MOD_RE = new RegExp(`(${MOD.map(m => m[0]).join('|')})(?:物|片|土)?(質|混じり|混り|まじり)`, 'g');
const MOD_SP = { line:0, dash:9, dots:4.5, bigdots:6.5, circles:7.5, ellipses:9, ticks:6, tilde:7.5, shells:8 };

const _cls = new Map();
function classify(name){
  name = name || '';
  if (_cls.has(name)) return _cls.get(name);
  // 主体: 修飾語として使われていない語のうち、末尾側で終わるもの（同位置なら長い語）
  let best = null;
  for (const [k, id] of MAIN) {
    let pos = name.indexOf(k);
    while (pos >= 0) {
      const end = pos + k.length;
      const after = name.slice(end, end + 3);
      const asMod = /^(物|片|土)?(質|混じり|混り|まじり)/.test(after) && !k.endsWith('土');
      if (!asMod && (!best || end > best.end || (end === best.end && k.length > best.k.length))) best = { k, id, pos, end };
      pos = name.indexOf(k, pos + 1);
    }
  }
  const mods = [];
  for (const m of name.matchAll(MOD_RE)) {
    const s = m.index, e = s + m[0].length;
    if (best && s < best.end && e > best.pos) continue;  // 主体語と重なるものは除外
    const sym = MOD.find(x => x[0] === m[1])[1];
    mods.push({ word: m[0], sym, n: m[2] === '質' ? 3 : 1 });
  }
  const r = { main: best ? best.id : null, mods };
  // 「埋土・砂」のように盛土・埋土が前に付くときは、柱の左側に盛土・埋土の模様を描く
  if (best && !['fill', 'reclaim'].includes(best.id)) { const fm = name.match(/埋め?土|盛り?土/); if (fm && fm.index < best.pos) r.fill = /埋/.test(fm[0]) ? 'reclaim' : 'fill'; }
  r.color = best ? (COLOR[best.id] || '#eeeeee') : '#ffffff';
  r.label = (r.fill ? PAT_NAME[r.fill] + '・' : '') + (best ? PAT_NAME[best.id] : '（模様なし）') + (mods.length ? ' ＋ ' + mods.map(m => m.word).join('・') : '');
  _cls.set(name, r);
  return r;
}

function patternDefs(){
  let s = '';
  for (const [id, [w, h, body, rot]] of Object.entries(PAT)) {
    s += `<pattern id="p-${id}" patternUnits="userSpaceOnUse" width="${w}" height="${h}"${rot ? ` patternTransform="rotate(${rot})"` : ''}><g stroke="${INK}" stroke-width=".8" fill="none">${body}</g></pattern>`;
  }

}
// 「質」「混じり」の帯（仕様 5.3）
function modPattern(id, sym, n, W, x0, yTop, hh){
  const rise = 0.6 * W, period = Math.max(1.6 * rise, 24);
  const ang = Math.atan2(rise, W), L = Math.hypot(W, rise), c = Math.cos(ang), sn = Math.sin(ang), deg = -ang * 180 / Math.PI;
  const base = 4;
  let body = '';
  const yc = base + (n - 1) * 2;
  body += `<line x1="0" y1="${yc + rise}" x2="${W}" y2="${yc}" stroke="#fff" stroke-opacity=".9" stroke-width="${n === 3 ? 12 : 5}"/>`;
  const sp = MOD_SP[sym];
  for (let i = 0; i < n; i++) {
    const y0 = base + i * 4;
    if (sym === 'line') { body += `<line x1="0" y1="${y0 + rise}" x2="${W}" y2="${y0}"/>`; continue; }
    for (let t = sp / 2; t < L; t += sp) {
      const x = (t * c).toFixed(2), y = (y0 + rise - t * sn).toFixed(2);
      const tr = `transform="translate(${x} ${y}) rotate(${deg.toFixed(1)})"`;
      switch (sym) {
        case 'dash': body += `<line ${tr} x1="-2.2" y1="0" x2="2.2" y2="0"/>`; break;
        case 'dots': body += `<circle cx="${x}" cy="${y}" r=".6" fill="${INK}" stroke="none"/>`; break;
        case 'bigdots': body += `<circle cx="${x}" cy="${y}" r="1.1" fill="${INK}" stroke="none"/>`; break;
        case 'circles': body += `<circle cx="${x}" cy="${y}" r="1.8"/>`; break;
        case 'ellipses': body += `<ellipse ${tr} cx="0" cy="0" rx="2.8" ry="1.5"/>`; break;
        case 'ticks': body += `<line ${tr} x1="0" y1="-1.8" x2="0" y2="1.8"/>`; break;
        case 'tilde': body += `<path ${tr} d="M-2.6 0q.65 -1.3 1.3 0t1.3 0t1.3 0t1.3 0"/>`; break;
        case 'shells': body += `<path ${tr} d="M-2 0A2 2 0 0 1 2 0Z"/>`; break;
      }
    }
  }
  const used = rise + 8 + (n - 1) * 4;  // 帯が占める高さ
  const y0 = yTop + (hh - used) / 2 - base;  // 層の中央に1組目が来るように合わせる
  return `<pattern id="${id}" patternUnits="userSpaceOnUse" x="${x0}" y="${y0.toFixed(2)}" width="${W}" height="${period}"><g stroke="${INK}" stroke-width=".7" fill="none">${body}</g></pattern>`;
}

const cur = () => S.logs[S.cur];
const figScroll = $('#figScroll'), figHead = $('#figHead'), figBody = $('#figBody');

function niceStep(ppm){
  for (const s of [1, 2, 5, 10, 20, 50, 100]) if (s * ppm >= 22) return s;
  return 100;
}
function wrapName(name){
  const chars = Array.from(name || '');
  const lines = [];
  for (let i = 0; i < chars.length; i += 7) lines.push(chars.slice(i, i + 7).join(''));
  if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].slice(0, 6) + '…'; }
  return lines;
}

function render(){
  const L = cur();
  renderInfo();
  if (!L) { figHead.innerHTML = ''; figHead.setAttribute('width', 0); figHead.setAttribute('height', 0);
    figBody.setAttribute('width', '100%'); figBody.setAttribute('height', 120);
    figBody.innerHTML = `<text x="50%" y="60" text-anchor="middle" font-size="13" fill="#6b7378" font-family="sans-serif">ファイルを開くか「サンプル」を押してください</text>`; return; }
  const o = S.opt, ppm = o.ppm, sh = 0;   // 深度補正は使わない（以前の版で保存された値も無視する）
  const hasCls = L.classes.length > 0;
  const avail = Math.max(320, figScroll.clientWidth - 2);
  const narrow = avail < 520;
  const axisW = narrow ? 30 : 46, gap = narrow ? 8 : 14;
  const showElev = o.elev !== false && L.elev !== null && L.elev !== undefined;
  const elevW = showElev ? (narrow ? 38 : 50) : 0, axR = elevW + axisW;   // 左から 標高｜深度｜軸
  const nW = o.n ? Math.round(Math.min(190, Math.max(narrow ? 84 : 120, avail * 0.3))) : 0;
  const colMin = narrow ? (hasCls ? 200 : 172) : (hasCls ? 260 : 230);
  const colW = o.log ? Math.round(Math.min(hasCls ? 330 : 300, Math.max(colMin, avail - axR - nW - gap - (o.n ? 34 : 6) - 8))) : 0;
  const colX = axR + 8;
  const nX = colX + colW + (o.log ? gap : 0);
  const W = nX + nW + (o.n ? 34 : 6);

  const layers = L.layers;
  const maxD = Math.max(L.total || 0, layers.length ? layers[layers.length - 1].bottom : 0, ...L.spt.map(s => s.depth + .3), 1);
  const d0 = Math.min(0, sh), d1 = maxD + Math.max(0, sh);
  const padT = 10, padB = 24;
  const y = d => padT + (d - d0) * ppm;
  const H = Math.ceil(y(d1) + padB);
  const step = niceStep(ppm);

  // ---- ヘッダー ----
  const HH = 44;
  let h = `<rect width="${W}" height="${HH}" fill="#fff"/><line x1="0" y1="${HH-.5}" x2="${W}" y2="${HH-.5}" stroke="#1f1f1f" stroke-width="1"/>`;
  if (showElev) h += `<text x="${elevW/2}" y="20" text-anchor="middle" class="hl">標高</text><text x="${elevW/2}" y="34" text-anchor="middle" class="hs">m</text>`;
  h += `<text x="${elevW + axisW/2}" y="20" text-anchor="middle" class="hl">深度</text><text x="${elevW + axisW/2}" y="34" text-anchor="middle" class="hs">GL-m</text>`;
  if (o.log) {
    const bX = colX + colW * .30, bW = colW * .30;
    h += `<text x="${colX + colW/2}" y="18" text-anchor="middle" class="hl">柱状図</text>`;
    h += `<text x="${bX + bW/2}" y="36" text-anchor="middle" class="hs">土質区分</text>`;
    if (hasCls) h += `<text x="${bX + bW + 17}" y="36" text-anchor="middle" class="hs">岩級</text>`;
    h += `<text x="${colX + colW*.10}" y="36" text-anchor="middle" class="hs">水位</text>`;
  }
  if (o.n) {
    h += `<text x="${nX + nW/2}" y="18" text-anchor="middle" class="hl">N値</text>`;

  }
  const style = `<style>
    text{font-family:"BIZ UDPGothic","Hiragino Sans",sans-serif;fill:#1f1f1f}

    .hn,.ax,.dn,.nl{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
    .hn{font-size:10px;fill:#444}.ax{font-size:10px;fill:#333}.ax.el{fill:#4a6b80}.dn{font-size:9px;fill:#333}.nl{font-size:9px;fill:#1d5b85}
    .nm{font-size:11px}.hit{cursor:pointer}.hit:hover{fill:rgba(29,91,133,.07)}.wl{font-size:9px;fill:#1a78c2;font-family:"IBM Plex Mono",ui-monospace,monospace}
  </style>`;
  figHead.setAttribute('width', W); figHead.setAttribute('height', HH); figHead.setAttribute('viewBox', `0 0 ${W} ${HH}`);
  figHead.innerHTML = style + h;

  // ---- 本体 ----
  let defs = patternDefs();
  const bandX = colX + colW * .30, bandW = colW * .30, bandR = bandX + bandW;

  let b = `<rect width="${W}" height="${H}" fill="#fff"/>`;
  // 深度軸
  b += `<line x1="${axR}" y1="${y(d0)}" x2="${axR}" y2="${y(d1)}" stroke="#1f1f1f" stroke-width=".8"/>`;
  if (showElev) b += `<line x1="${elevW}" y1="${y(d0)}" x2="${elevW}" y2="${y(d1)}" stroke="#c9ced2" stroke-width=".8"/>`;
  for (let d = Math.ceil(d0); d <= d1 + 1e-6; d++) {
    const major = Math.abs(d % step) < 1e-6;
    if (!major && ppm < 6) continue;
    b += `<line x1="${axR - (major ? 6 : 3)}" y1="${y(d)}" x2="${axR}" y2="${y(d)}" stroke="#1f1f1f" stroke-width=".7"/>`;

      b += `<text x="${axR - 9}" y="${y(d) + 3.5}" text-anchor="end" class="ax">${d}</text>`;
      if (showElev) b += `<text x="${elevW - 4}" y="${y(d) + 3.5}" text-anchor="end" class="ax el">${f2(L.elev - (d - sh))}</text>`;
      if (o.n) b += `<line x1="${nX}" y1="${y(d)}" x2="${nX + nW}" y2="${y(d)}" stroke="#e3e6e8" stroke-width="1"/>`;
    }
  }

  // 柱状図列
  if (o.log) {
    const hasLabelX = hasCls ? bandR + 34 + 6 : bandR + 6;
    const nameW = colX + colW - hasLabelX;
    const fs = Math.max(8, Math.min(11, Math.floor(nameW / 7)));
    let top = 0, lastLabelY = -1e9;
    layers.forEach((ly, i) => {
      const t = top + sh, bt = ly.bottom + sh;
      const yt = y(t), yb = y(bt), hh = Math.max(0, yb - yt);
      top = ly.bottom;
      if (hh <= 0) return;
      const c = classify(ly.name);
      b += `<rect x="${bandX}" y="${yt}" width="${bandW}" height="${hh}" fill="${o.color ? c.color : '#fff'}"/>`;
      if (c.main) b += `<rect x="${c.fill ? bandX + bandW * .35 : bandX}" y="${yt}" width="${c.fill ? bandW * .65 : bandW}" height="${hh}" fill="url(#p-${c.main})"/>`;
      if (c.fill) b += `<rect x="${bandX}" y="${yt}" width="${bandW * .35}" height="${hh}" fill="url(#p-${c.fill})"/><line x1="${bandX + bandW * .35}" y1="${yt}" x2="${bandX + bandW * .35}" y2="${yt + hh}" stroke="#1f1f1f" stroke-width=".5"/>`;
      c.mods.forEach((m, k) => { const id = `m-${i}-${k}`; defs += modPattern(id, m.sym, m.n, bandW, bandX, yt, hh); b += `<rect x="${bandX}" y="${yt}" width="${bandW}" height="${hh}" fill="url(#${id})"/>`; });
      b += `<line x1="${bandX}" y1="${yb}" x2="${bandR}" y2="${yb}" stroke="#1f1f1f" stroke-width=".9"/>`;
      // 層境界深度
      if (yb - lastLabelY >= 10 || i === layers.length - 1) {
        b += `<text x="${bandX - 4}" y="${yb + 3}" text-anchor="end" class="dn">${f2(bt)}</text>`;
        lastLabelY = yb;
      }
      // 土質名
      const lines = wrapName(ly.name);
      const lh = fs + 2;
      if (lines.length && hh >= lines.length * lh + 2) {
        const cy = yt + hh / 2 - (lines.length - 1) * lh / 2;
        lines.forEach((s, k) => { b += `<text x="${hasLabelX}" y="${cy + k * lh + fs * .36}" class="nm" style="font-size:${fs}px">${esc(s)}</text>`; });
      }
    });
    const lb = layers.length ? layers[layers.length - 1].bottom + sh : 0;
    if (layers.length) b += `<rect x="${bandX}" y="${y(sh)}" width="${bandW}" height="${y(lb) - y(sh)}" fill="none" stroke="#1f1f1f" stroke-width="1"/>`;
    // 岩級列
    if (hasCls) {
      const cx = bandR + 4, cw = 26;
      L.classes.forEach(cl => {

        if (hh <= 0) return;
        b += `<rect x="${cx}" y="${yt}" width="${cw}" height="${hh}" fill="#fff" stroke="#1f1f1f" stroke-width=".7"/>`;

      });
    }
    // 孔内水位（初回のみ）
    if (L.water.length) {
      const w = L.water[0], wy = y(w.depth + sh), wx = colX + colW * .10;
      b += `<path d="M${wx-5} ${wy-8}L${wx+5} ${wy-8}L${wx} ${wy}Z" fill="#fff" stroke="#1a78c2" stroke-width="1.2"/>`;
      b += `<line x1="${wx-9}" y1="${wy}" x2="${wx+9}" y2="${wy}" stroke="#1a78c2" stroke-width="1.2"/>`;
      b += `<text x="${wx}" y="${wy + 11}" text-anchor="middle" class="wl">GL-${f2(w.depth)}m</text>`;
      if (w.date) b += `<text x="${wx}" y="${wy + 21}" text-anchor="middle" class="wl">${esc(w.date)}</text>`;
    }
    // 層の選択（タップで詳細を開く）
    let tt = 0;
    layers.forEach((ly, i) => {
      const yt = y(tt + sh), yb = y(ly.bottom + sh); tt = ly.bottom;
      if (yb - yt <= 0) return;
      if (i === S.sel) b += `<rect x="${bandR}" y="${yt}" width="${colX + colW - bandR}" height="${yb - yt}" fill="#e07a1f" fill-opacity=".12"/><rect x="${bandX - 1.5}" y="${yt - 1.5}" width="${bandW + 3}" height="${yb - yt + 3}" fill="none" stroke="#e07a1f" stroke-width="3"/>`;
      b += `<rect class="hit" data-ly="${i}" x="${colX}" y="${yt}" width="${colW}" height="${yb - yt}" fill="transparent"><title>${esc(ly.name || '（名称なし）')}：タップで詳細</title></rect>`;
    });
  }

  // N値列
  if (o.n) {
    b += `<rect x="${nX}" y="${y(d0)}" width="${nW}" height="${y(d1) - y(d0)}" fill="none" stroke="#1f1f1f" stroke-width=".8"/>`;
    for (let v = 10; v < 50; v += 10) { const x = nX + nW * v / 50; b += `<line x1="${x}" y1="${y(d0)}" x2="${x}" y2="${y(d1)}" stroke="#d5d9dc" stroke-dasharray="2 3"/>`; }
    const pts = L.spt.map(s => ({ d: s.depth + sh, ...calcN(s) })).filter(p => p.N !== null).sort((a, b2) => a.d - b2.d);

      pts.forEach(p => {
        const x = px(p), yy = y(p.d);
        b += `<circle cx="${x}" cy="${yy}" r="2.6" fill="#1d5b85"/>`;
        if (p.N > 50) b += `<text x="${x + 5}" y="${yy + 3.5}" class="nl" style="font-size:11px;font-weight:500">&gt;</text>`;
        if (p.label) {
          const right = x < nX + nW * .62;
          b += `<text x="${right ? x + 5 : x - 5}" y="${yy + 3}" text-anchor="${right ? 'start' : 'end'}" class="nl">${esc(p.label)}</text>`;

  if (!o.log && !o.n) b += `<text x="${W/2}" y="40" text-anchor="middle" class="hs">表示する列を選んでください</text>`;

  figBody.setAttribute('width', W); figBody.setAttribute('height', H); figBody.setAttribute('viewBox', `0 0 ${W} ${H}`);
  figBody.innerHTML = style + `<defs>${defs}</defs>` + b;
}

function swatch(name){

  return `<span class="sw"><svg width="30" height="18" viewBox="0 0 30 18"><rect width="30" height="18" fill="${S.opt.color ? c.color : '#fff'}"/><rect width="30" height="18" fill="${fill}"/></svg><span>${esc(c.label)}</span></span>`;

// 標準貫入試験の3区間 [[打撃, 貫入cm], ...]（空欄は null）
function sptIv(sp){
  const src = (sp.iv && sp.iv.length) ? sp.iv : ivOf(sp);
  const out = [0, 1, 2].map(j => src[j] ? [src[j][0], src[j][1]] : [null, null]);
  return out;
}
function sptRecalc(sp){
  const iv = sptIv(sp).filter(([b, p]) => b !== null || p !== null).map(([b, p]) => [b ?? 0, p ?? 10]);
  sp.iv = iv;
  sp.blows = iv.length ? iv.reduce((a, x) => a + x[0], 0) : null;
  sp.pen = iv.length ? Math.round(iv.reduce((a, x) => a + x[1], 0) * 10) / 10 : null;
  sp.ivEdited = true;
}
const sptSumText = s => (s.blows === null || s.blows === undefined) ? '—' : `${s.blows}/${s.pen ?? '—'}`;
function sptNText(s){ const n = calcN(s); return n.N === null ? '—' : (n.label ? `${n.N.toFixed(1)}` : String(n.N)); }

  return t ? `<div class="attr">${esc(t)}</div>` : '';
}

const DRL_KEYS = ['r5020', 'r5030', 'r5040', 'r5050', 'r5060'];
function rockInit(L){

  if (!L.rockIv.length && !L.rockIvBuilt && AT.some(f => (R0[f] || []).length)) {   // XML の区分（項目ごとの区間）から区間記録を作る
    L.rockIvBuilt = true;

    const bs = [...new Set([...AT.flatMap(f => (R0[f] || []).map(iv => iv.bottom)), ...XI.note.map(n => n.bottom)].map(b => +(+b).toFixed(2)))].sort((a, b) => a - b);
    const at = (list, d) => { const iv = (list || []).find(x => d > (x.top ?? 0) + 1e-6 && d <= x.bottom + 1e-6); return iv ? iv.v || '' : ''; };

      r[f] = (iv.v === undefined || iv.v === null) ? '' : String(iv.v); m.set(k, r);
    });
    add(R.rec, 'rec'); add(R.maxc, 'maxc'); add(R.rqd, 'rqd');

  for (const k of DRL_KEYS) L.drl[k] = L.drl[k] || [];

// .gan の 2001・2002 を区間記録から作る（記事を変えていない区間は元の行のまま）
function gan2001FromIv(L){
  const tv = v => { const t = String(v ?? '').trim(); return t ? t.replace(/ +/g, '_') : '@'; };
  const l01 = [], l02 = [];
  for (const iv of L.rockIv) {
    const notes = (iv.textEdited || !iv.notes) ? String(iv.text || '').split('\n').filter(x => x.trim()) : iv.notes;
    l01.push(['2001', nstr(iv.bottom), tv(iv.sub), tv(iv.color), tv(iv.hard), tv(iv.shape), tv(iv.crack), tv(iv.weather), tv(iv.alter), '-1', String(notes.length)].join(' '));
    notes.forEach(n => l02.push(`2002 ${n}`));
  }
  return l01.concat(l02);
}
function ganRockGroups(L, G, fromGan, waterBefore, waterAfter){
  rockInit(L);
  const RE = L.rockEdited || {};
  const n9 = v => (v === '' || v === null || v === undefined) ? '9999' : String(v);
  const tv = v => { const t = String(v ?? '').trim(); return t ? t.replace(/ +/g, '_') : '@'; };
  if (RE.iv || (!fromGan && L.rockIv && L.rockIv.length)) { G['2001'] = gan2001FromIv(L); G['2002'] = []; }
  if (RE.core || (!fromGan && L.core && L.core.length)) {
    G['3000'] = L.core.filter(c => c.maxc !== '' || c.rqd !== '').map(c => `3000 ${nstr(c.depth)} ${c.maxc === '' ? '0' : c.maxc} ${c.rqd === '' ? '0' : c.rqd}`);
    G['3010'] = L.core.filter(c => c.rec !== '').map(c => `3010 ${nstr(c.depth)} ${c.rec}`);
  }
  const D = L.drl || {};
  const any = DRL_KEYS.some(k => (D[k] || []).length);
  if (RE.drl || (!fromGan && any)) {
    G['5020'] = (D.r5020 || []).map(r => `5020 ${nstr(r.depth)} ${n9(r.speed)} ${n9(r.press)} ${n9(r.rpm)}`);
    G['5030'] = (D.r5030 || []).map(r => `5030 ${nstr(r.depth)} ${tv(r.bit)}`);
    G['5040'] = (D.r5040 || []).map(r => `5040 ${nstr(r.depth)} ${n9(r.wp)} ${n9(r.wq)} ${tv(r.wtype)} ${n9(r.wout)}`);
    G['5060'] = (D.r5060 || []).map(r => `5060 ${nstr(r.depth)} ${n9(r.dia)} ${tv(r.method)} ${tv(r.state)}`);
    const used = new Set();
    G['5050'] = (D.r5050 || []).map(r => {
      const d = mdOf(r.date), b = waterBefore.find(w => w.date === r.date), a = waterAfter.find(w => w.date === r.date);

    });
    return used;
  }
  return null;
}


/* ---------------- 掘進月日（毎日の掘進長） ---------------- */
function drillEditor(L){
  const D = L.drill = L.drill || [];
  let h = `<h3 class="sub" id="drill-h">掘進月日（毎日の掘進長）</h3><div class="tw"><table class="ed dr"><thead><tr><th>月日</th><th>掘進深度 GL-m<br><small>その日の終わり</small></th><th>掘進長 m<br><small>その日の分</small></th><th>ケーシング<br><small>下端 GL-m</small></th><th></th></tr></thead><tbody>`;

  D.forEach((d, i) => {
    const len = d.depth - prev; sum += len;
    h += `<tr><td><input id="dr-${i}-date" data-dr="${i}" data-f="date" placeholder="4.1" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="${esc(d.date || '')}"></td>`

      + `<td><button class="del" type="button" data-drdel="${i}" aria-label="${i + 1}行目を削除">×</button></td></tr>`;
    prev = d.depth;
  });

  const last = D.length ? D[D.length - 1].depth : null;

// File.arrayBuffer() がない古い iOS 向けに FileReader でも読む
function readBuf(f){
  if (typeof f.arrayBuffer === 'function') return f.arrayBuffer();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error || new Error('ファイルを読めませんでした')); r.readAsArrayBuffer(f); });
}
async function openFiles(files){
  if (!files.length) { toast('ファイルを受け取れませんでした。もう一度「ファイルを開く」から選んでください。', true); return; }
  const msgs = [], ok = [];
  toast('読み込んでいます…');
  for (const f of files) {
    try {
      const buf = await readBuf(f);
      if (!buf || !buf.byteLength) throw new Error(`${f.name}: 中身が空です（iCloud などから取り込み中の可能性があります）`);
      const L = parseAny(decode(buf, f.name), f.name);
      S.logs.push(L); S.cur = S.logs.length - 1; ok.push(L);
    } catch (err) { msgs.push(err && err.message ? err.message : String(err)); }
  }
  try { _cls.clear(); render(); renderEdit(); save(); }
  catch (err) { msgs.push(`表示に失敗しました：${err && err.message ? err.message : err}`); }
  if (msgs.length) { toast(msgs.join(' ／ '), true); $('#status').innerHTML += msgs.map(m => ` <span class="w">⚠ ${esc(m)}</span>`).join(''); }
  else toast(`${ok.map(L => L.name || L.source).join('、')} を読み込みました（${ok.map(L => L.layers.length + '層').join('、')}）`);

}

// 2001（区間の色調ほか）・2002（記事）を組み立てる。2002 は 2001 の後にまとめて並べる
function gan2001(L, fromGan){
  const layerOf = (top, bottom) => layerAtBottom(L, bottom);
  const ivs = [];
  if (fromGan) {
    const n2 = [];
    for (const line of L.raw.lines) {
      const tok = line.trim().split(/ +/);
      if (tok[0] === '2001') {
        let b = num(tok[1]); if (b === null) continue;
        const b2 = remapDepth(L, b); if (b2 !== b) { b = b2; tok[1] = nstr(b); }

      } else if (tok[0] === '2002') n2.push(line.trim().replace(/^2002 ?/, ''));
    }
    let k = 0;
    for (const iv of ivs) { iv.notes = n2.slice(k, k + iv.n); k += iv.n; }
    if (k < n2.length && ivs.length) ivs[ivs.length - 1].notes.push(...n2.slice(k));
    let p = 0; for (const iv of ivs) { iv.top = p; p = iv.bottom; }
  }
  const usedNote = new Set();
  for (const iv of ivs) {
    const ly = layerOf(iv.top, iv.bottom); if (!ly || !ly.ed) continue;
    if (ly.ed.color) iv.tok[3] = tokS(ly.color);
    if (ly.ed.note) { iv.notes = usedNote.has(ly) ? [] : String(ly.note || '').split('\n').filter(x => x.trim()); usedNote.add(ly); }
  }
  // 区間の記録がない層は新しく作る
  let t = 0;
  for (const ly of L.layers) {
    const has = ivs.some(iv => layerOf(iv.top, iv.bottom) === ly);
    const want = fromGan ? (ly.ed && (ly.ed.color || ly.ed.note) && (ly.color || ly.note)) : (ly.color || ly.note);
    if (!has && want) ivs.push({ top: t, bottom: ly.bottom, tok: ['2001', nstr(ly.bottom), '@', tokS(ly.color), '@', '@', '@', '@', '@', '-1', '0'], notes: String(ly.note || '').split('\n').filter(x => x.trim()) });
    t = ly.bottom;
  }
  ivs.sort((a, b) => a.bottom - b.bottom);
  const l01 = [], l02 = [];
  for (const iv of ivs) { iv.tok[10] = String(iv.notes.length); l01.push(iv.tok.join(' ')); iv.notes.forEach(n => l02.push(`2002 ${n}`)); }

}

// ---- 岩盤柱状図：本体（区間の記録・グラフ・試験・掘進状況） ----

    line(R.rec, '#2e5aac', (x, y) => `<path d="M${(x - .55).toFixed(2)} ${(y + .5).toFixed(2)}L${x.toFixed(2)} ${(y - .55).toFixed(2)}L${(x + .55).toFixed(2)} ${(y + .5).toFixed(2)}Z" fill="#fff" stroke="#2e5aac" stroke-width=".15"/>`,

      else B_GROUP.forEach((k, j) => {
        if (!iv[j] || (iv[j][1] <= 0 && iv[j][0] <= 0)) return;
        frac(X[k], ys, iv[j][0], Math.abs(iv[j][1] - 10) < 1e-6 ? null : Math.round(iv[j][1] * 10) / 10);
      });
    }
    if (has('bp') && sp.blows !== null && sp.pen !== null) frac(X.bp, ys, sp.blows, Math.round(sp.pen * 10) / 10);
  });
  pts.sort((a, b) => a.d - b.d);
  if (has('ng') && pts.length) {
    let path = '';
    pts.forEach((q, i) => {
      const a = pts[i - 1];
      path += (a && !(a.N > N_MAX && q.N > N_MAX) ? 'L' : 'M') + `${nx(q.N).toFixed(2)} ${yy(q.d).toFixed(2)}`;
    });
    body += `<path d="${path}" fill="none" stroke="#000" stroke-width=".25"/>`;
    pts.forEach(q => {
      if (!vis(q.d, q.d)) return;
      const y = yy(q.d);
      body += txFit(X.ng.x + nOff / 2, y + .9, String(Math.round(q.N)), 2.4, nOff - .4, 'middle');
      if (q.N > N_MAX) body += hl(nx(N_MAX) - 4.5, y, nx(N_MAX) - .3, y, .2) + `<path d="M${(nx(N_MAX) - 1.4).toFixed(2)} ${(y - .6).toFixed(2)}L${(nx(N_MAX) - .2).toFixed(2)} ${y.toFixed(2)}L${(nx(N_MAX) - 1.4).toFixed(2)} ${(y + .6).toFixed(2)}" fill="none" stroke="#000" stroke-width=".2"/>`;
      else body += `<circle cx="${nx(q.N).toFixed(2)}" cy="${y.toFixed(2)}" r=".7" fill="#fff" stroke="#000" stroke-width=".15"/>`;
    });
  }

  // 試料採取
  for (const sm of (L.samples || [])) {
    if (!vis(sm.top, sm.bottom)) continue;
    if (has('sd')) depthPair(X.sd, sm.top, sm.bottom);
    const ym = (yy(sm.top) + yy(sm.bottom)) / 2 + .8;
    if (has('sno') && sm.no) body += txFit(X.sno.x + X.sno.w / 2, ym, sm.no, 2.0, X.sno.w - .4, 'middle');
    if (has('smt') && sm.method && sm.method !== '-') body += txFit(X.smt.x + X.smt.w / 2, ym, sm.method, 2.0, X.smt.w - .4, 'middle');
  }

  // 掘進月日（月の下に日）
  for (const dr of (L.drill || [])) {
    if (!vis(dr.depth, dr.depth) || !dr.date) continue;
    const [m, d] = dr.date.split('/'), c = X.drill, y = yy(dr.depth), x = c.x + c.w / 2;
    body += tx(x, y - 3.4, m, 2.2, 'middle') + hl(c.x + .8, y - 2.8, c.r - .8, y - 2.8, .1) + tx(x, y - .6, d || '', 2.2, 'middle') + hl(c.x, y, c.r, y, .12);
  }

  defs += `<clipPath id="bodyclip"><rect x="${PG.L}" y="${BY}" width="${PG.R - PG.L}" height="${BB - BY}"/></clipPath>`;
  s += `<g clip-path="url(#bodyclip)">${body}</g>`;

  // ---- 罫線 ----
  const grpOf = k => SD.groups.find(gr => gr[0].includes(k));
  for (let i = 1; i < SD.cols.length; i++) {
    const k0 = SD.cols[i - 1][0], k1 = SD.cols[i][0];
    let y0 = bodyTop;
    if (P.first) {
      const g0 = grpOf(k0), g1 = grpOf(k1);
      if (g0 && g0 === g1) y0 = G1;
      if (B_GROUP.includes(k0) && B_GROUP.includes(k1)) y0 = G2;
    }
    body = '';
    s += hl(X[k1].x, y0, X[k1].x, BB, k1 === 'unit' || k1 === 'water' ? .15 : .2);
  }
  s += `<rect x="${PG.L}" y="${bodyTop}" width="${PG.R - PG.L}" height="${(BB - bodyTop).toFixed(2)}" fill="none" stroke="#000" stroke-width=".45"/>`;

  const size = pxW ? `width="${pxW}" height="${pxH}"` : 'width="100%"';
  return `<svg xmlns="http://www.w3.org/2000/svg" ${size} viewBox="0 0 ${PG.W} ${PG.H}" font-family="${SH_FONT}"><defs>${defs}</defs><rect width="${PG.W}" height="${PG.H}" fill="#fff"/><g fill="#000">${s}</g></svg>`;
}

/* ---------------- 画像化と PDF ---------------- */
function svgImage(svg){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('柱状図の描画に失敗しました'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function makeStdPDF(L, dpi = 250, onPage, kind = 'soil'){
  const n = stdPageCount(L), k = dpi / 25.4, w = Math.round(PG.W * k), h = Math.round(PG.H * k);   // A3
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const pages = [];
  for (let p = 0; p < n; p++) {
    if (onPage) onPage(p + 1, n);
    const img = await svgImage(stdSheetSVG(L, p, n, w, h, kind));
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res, rej) => { try { cv.toBlob(b => b ? res(b) : rej(new Error('画像に変換できませんでした')), 'image/jpeg', 0.92); } catch (e) { rej(e); } });
    pages.push({ w, h, jpg: new Uint8Array(await blob.arrayBuffer()) });
  }
  return pdfFromJpegs(pages);
}
function pdfFromJpegs(pages){
  const enc = new TextEncoder(), chunks = [], offs = [];
  let len = 0;
  const put = x => { const u = typeof x === 'string' ? enc.encode(x) : x; chunks.push(u); len += u.length; };
  const obj = (id, body) => { offs[id] = len; put(`${id} 0 obj\n`); body(); put('\nendobj\n'); };
  put('%PDF-1.4\n'); put(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  const n = pages.length, total = 3 + 3 * n;
  obj(1, () => put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => put(`<< /Type /Pages /Kids [${pages.map((_, k) => `${3 + 3 * k} 0 R`).join(' ')}] /Count ${n} >>`));
  pages.forEach((pg, k) => {
    const pid = 3 + 3 * k, cid = pid + 1, iid = pid + 2;
    obj(pid, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 1190.55] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    const cs = 'q 841.89 0 0 1190.55 0 0 cm /Im0 Do Q';
    obj(cid, () => put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(iid, () => { put(`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpg.length} >>\nstream\n`); put(pg.jpg); put('\nendstream'); });
  });
  const xref = len;
  put(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let i = 1; i < total; i++) put(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}

/* ---------------- ヘッダー項目の読み取り（XML） ---------------- */
function jDate(t){ const m = String(t || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); return m ? `${+m[1]}年${+m[2]}月${+m[3]}日` : (t || ''); }
function xmlHdr(doc){
  const leaves = Array.from(doc.getElementsByTagName('*')).filter(e => !e.children.length && e.textContent.trim());
  const find = re => { const e = leaves.find(x => re.test(x.tagName)); return e ? e.textContent.trim() : ''; };
  const latlon = (key) => {
    const g = u => { const e = doc.getElementsByTagName(`${key}_${u}`)[0]; return e ? e.textContent.trim() : ''; };
    if (g('度')) return `${g('度')}° ${g('分')}′ ${g('秒')}″`;
    return find(new RegExp(key)) || '';
  };
  const st = find(/開始年月日/), en = find(/終了年月日/);
  return {
    survey: find(/^調査名$/), project: find(/^(事業・工事名|事業名|工事名)$/), place: find(/調査位置住所|^調査位置$/),
    lat: latlon('緯度'), lon: latlon('経度'), client: find(/発注機関名|^発注機関$/),
    period: st || en ? `${jDate(st)}〜${jDate(en)}` : '', company: find(/調査会社.*名称|調査業者名|^調査会社名$/),
    chief: find(/主任技師/), agent: find(/現場代理人/), core: find(/コア鑑定者/), boring: find(/ボーリング責任者/),
    angle: find(/^角度$/), dir: find(/^(方向|方位)$/), slope: find(/地盤勾配/),
    machine: find(/^試錐機/), engine: find(/^エンジン/), pump: find(/^ポンプ/),
    phone: find(/調査会社_TEL|調査会社.*電話/), hammer: find(/ハンマー/),
    datum: ((find(/^フリー情報$/).match(/標高基準[：:]\s*([^\]］\s]+)/) || [])[1] || ''),
  };
}

  if (!shareable(file) && fmt !== 'pdf') file = new File([data], fname, { type: 'application/octet-stream' });
  if (shareable(file)) {
    try { await navigator.share({ files: [file] }); msg.textContent = `${fname} を渡しました。`; return; }
    catch (e) {
      if (e && e.name === 'AbortError') { msg.textContent = '保存を取り消しました。'; return; }

/* ---------------- 層の詳細（色調・相対密度・相対稠度・記事） ---------------- */
const LD_F = ['name', 'code', 'color', 'note'];
const DENS1 = ['非常に緩い', '緩い', '中位の', '密な', '非常に密な'];
const CONS1 = ['非常に軟らかい', '軟らかい', '中位の', '硬い', '非常に硬い', '固結した'];
const withRanges = a => a.flatMap((v, i) => i ? [`${a[i - 1]}～${v}`, v] : [v]);
const DENS = withRanges(DENS1), CONS = withRanges(CONS1);
// N値からの相対密度・相対稠度の目安（Terzaghi & Peck の区分。地盤調査の方法と解説などと同じ）
const DENS_N = [4, 10, 30, 50];          // 〜4 非常に緩い／4〜10 緩い／10〜30 中位の／30〜50 密な／50〜 非常に密な
const CONS_N = [2, 4, 8, 15, 30];        // 〜2 非常に軟らかい／2〜4 軟らかい／4〜8 中位の／8〜15 硬い／15〜30 非常に硬い／30〜 固結した
const SANDY = ['sand', 'finesand', 'coarsesand', 'gravel', 'sandgravel', 'boulder', 'masa', 'shirasu', 'pumice', 'scoria'];
const CLAYEY = ['cohesive', 'clay', 'silt', 'hardclay', 'organic', 'volclay', 'humus', 'loam', 'kuroboku', 'ash', 'topsoil'];
function dcKind(name){
  const m = classify(name).main;
  if (SANDY.includes(m)) return 'density';
  if (CLAYEY.includes(m)) return 'consistency';
  if (/砂質土|礫質土|砂礫|砂$|礫$/.test(name || '')) return 'density';    // 「埋土・砂質土」など
  if (/粘性土|粘土|シルト|ローム/.test(name || '')) return 'consistency';
  return null;
}
// 層の中の標準貫入試験（試験区間の中央が層に入るもの）のN値から目安を出す
function dcPredict(L, i){
  const ly = L.layers[i]; if (!ly) return null;
  const kind = dcKind(ly.name); if (!kind) return { kind: null, why: '土質名から砂質土・粘性土を判定できません' };
  const top = i ? L.layers[i - 1].bottom : 0;
  const ns = L.spt.filter(sp => { const c = sp.depth + Math.min(30, sp.pen || 30) / 200; return c > top && c <= ly.bottom + 1e-6; })
    .map(sp => calcN(sp).N).filter(n => n !== null && n !== undefined).sort((a, b) => a - b);
  if (!ns.length) return { kind, why: 'この層には標準貫入試験がありません' };
  const at = q => ns[Math.min(ns.length - 1, Math.max(0, Math.round((ns.length - 1) * q)))];
  const lo = at(.2), hi = at(.8);   // 外れ値に引っぱられないよう、下から2割と8割の値を使う
  const th = kind === 'density' ? DENS_N : CONS_N, names = kind === 'density' ? DENS1 : CONS1;
  const cls = n => { let k = 0; while (k < th.length && n >= th[k]) k++; return k; };
  const a = cls(lo), b = cls(hi);
  const v = a === b ? names[a] : `${names[a]}～${names[b]}`;
  const fmt = n => n >= 50 ? '50以上' : String(Math.round(n));
  return { kind, v, n: ns.length, range: fmt(ns[0]) === fmt(ns[ns.length - 1]) ? fmt(ns[0]) : `${fmt(ns[0])}〜${fmt(ns[ns.length - 1])}` };
}
function dcApply(L, i, pr){
  const ly = L.layers[i];
  const other = pr.kind === 'density' ? 'consistency' : 'density';
  ly[pr.kind] = pr.v; ly[other] = '';
  ly.ed = Object.assign({}, ly.ed, { density: true, consistency: true });
}
function fillSelect(sel, list, v){
  const opts = [''].concat(list);
  if (v && !list.includes(v)) opts.push(v);   // ファイルにある値はそのまま残す
  sel.innerHTML = opts.map(o => `<option value="${esc(o)}"${o === (v || '') ? ' selected' : ''}>${o ? esc(o) : '（なし）'}</option>`).join('');
}
const elevAt = (L, d) => (L.elev === null || L.elev === undefined) ? '' : `標高 ${f2(L.elev - d)} m`;
function openLayer(i){
  const L = cur(); if (!L || !L.layers[i]) return;
  S.sel = i; fillLayer();
  $('#lyModal').hidden = false;
  render();
}
function fillLayer(){
  const L = cur(), i = S.sel, ly = L && L.layers[i]; if (!ly) return;
  $('#ldMsg').textContent = '';
  const top = i ? L.layers[i - 1].bottom : 0;
  $('#lyTitle').textContent = `${i + 1}層目　${ly.name || '（名称なし）'}`;
  $('#lyDepth').textContent = `層厚 ${f2(ly.bottom - top)} m`;
  $('#ld-top').value = f2(top); $('#ld-top').disabled = i === 0;
  $('#ld-bottom').value = f2(ly.bottom);
  $('#ld-top-el').textContent = elevAt(L, top);
  $('#ld-bottom-el').textContent = elevAt(L, ly.bottom);
  for (const f of LD_F) document.getElementById('ld-' + f).value = ly[f] || '';
  fillSelect($('#ld-density'), DENS, ly.density);
  fillSelect($('#ld-consistency'), CONS, ly.consistency);
  const pr = dcPredict(L, i), box = $('#ldPred');
  if (pr && pr.v) {
    const same = (ly[pr.kind] || '') === pr.v;
    box.innerHTML = `N値からの目安：<b>${pr.kind === 'density' ? '相対密度' : '相対稠度'} ${esc(pr.v)}</b>（N=${pr.range}、${pr.n}回）`
      + (same ? '' : ` <button type="button" class="btn small" id="ldPredGo">入れる</button>`);
  } else box.textContent = pr ? `N値からの目安：${pr.why}` : '';
  $('#ld-sw').innerHTML = swatch(ly.name);
  $('#ldPrev').disabled = i <= 0;
  $('#ldNext').disabled = i >= L.layers.length - 1;
}
function closeLayer(){ $('#lyModal').hidden = true; S.sel = null; render(); }
$('#lyModal').addEventListener('click', e => {
  if (e.target.id !== 'ldPredGo') return;
  const L = cur(), pr = L && dcPredict(L, S.sel); if (!pr || !pr.v) return;
  dcApply(L, S.sel, pr); fillLayer(); render(); renderEdit(); save();
});
$('#lyModal').addEventListener('change', e => {
  const L = cur(), ly = L && L.layers[S.sel]; if (!ly) return;
  if (e.target.dataset.d) { changeDepth(L, S.sel, e.target.dataset.d, num(e.target.value)); return; }
  const f = e.target.dataset.f; if (!f) return;
  ly[f] = f === 'note' ? e.target.value.replace(/\s+$/, '') : e.target.value.trim();
  ly.ed = Object.assign({}, ly.ed, { [f]: true });
  if (f === 'note') delete ly.noteRaw;
  if (f === 'name') { $('#ld-sw').innerHTML = swatch(ly.name); $('#lyTitle').textContent = `${S.sel + 1}層目　${ly.name || '（名称なし）'}`; }
  render(); renderEdit(); save();
});
// 区間深度の変更：上端は1つ上の層の下端と同じ境界なので、境界を動かす
function changeDepth(L, i, which, v){
  const n = L.layers.length, ly = L.layers[i];
  const top = i ? L.layers[i - 1].bottom : 0;
  let msg = '';
  if (which === 'top') {
    const lo = i >= 2 ? L.layers[i - 2].bottom : 0;
    if (i === 0) msg = '1層目の上端は地表（GL-0.00 m）です。';
    else if (v === null || v <= lo || v >= ly.bottom) msg = `上端深度は GL-${f2(lo)} m より深く、GL-${f2(ly.bottom)} m より浅くしてください。`;
    else moveBoundary(L, i - 1, v);
  } else {
    const hi = i < n - 1 ? L.layers[i + 1].bottom : Infinity;
    if (v === null || v <= top || v >= hi) msg = `下端深度は GL-${f2(top)} m より深く${hi < Infinity ? `、GL-${f2(hi)} m より浅く` : ''}してください。`;
    else moveBoundary(L, i, v);
  }
  fillLayer();
  $('#ldMsg').textContent = msg;
  if (!msg) { render(); renderEdit(); save(); }
}
$('#ldPrev').addEventListener('click', () => { if (S.sel > 0) { S.sel--; fillLayer(); render(); } });
$('#ldNext').addEventListener('click', () => { const L = cur(); if (L && S.sel < L.layers.length - 1) { S.sel++; fillLayer(); render(); } });
$('#ldClose').addEventListener('click', closeLayer);
$('#lyModal').addEventListener('click', e => { if (e.target.id === 'lyModal') closeLayer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#lyModal').hidden) closeLayer(); });
figBody.addEventListener('click', e => { const h = e.target.closest && e.target.closest('[data-ly]'); if (h) openLayer(+h.dataset.ly); });

/* ---------------- 起動 ---------------- */
if (!restore() || !S.logs.length) loadSamples();
syncOpts(); render(); renderEdit();
let _rz = 0;
window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(render, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>

      });
