# 5万分の1地質図幅の一覧（g50index.json）を作って、リポジトリに入れる
# GitHub の「Actions」→「地質図幅の一覧を作る」→「Run workflow」で実行（毎月1日にも自動で実行）
name: 地質図幅の一覧を作る
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 1 * *'   # 毎月2日 3:23（日本時間）
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 一覧を作る
        run: python scripts/make_g50index.py g50index.json
      - name: 変わっていればリポジトリに入れる
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add g50index.json
          if git diff --cached --quiet; then echo "変更なし"; else git commit -m "地質図幅の一覧を更新" && git push; fi
